name: GhanaVoice CI

on:
  push:
    paths: ['ghanavoice/**', '.github/workflows/ghanavoice-ci.yml']
  pull_request:
    paths: ['ghanavoice/**']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghanavoice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ghanavoice/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run kb:validate
      - run: python3 evaluation/scripts/test_compute_metrics.py
      - run: npm run build
        env:
          GHANAVOICE_MODE: demo
