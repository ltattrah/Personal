# Full Phase 2 stack: TimescaleDB+PostGIS, Mosquitto MQTT, the API, the MQTT ingest service and
# (profile "demo") the fleet simulator standing in for real trackers.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: transit
    volumes:
      - dbdata:/home/postgres/pgdata/data
      - ./deploy/init-timescale.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit"]
      interval: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://transit:transit@db:5432/transit
      MQTT_HOST: mqtt
      TRACKER_API_KEY: ${TRACKER_API_KEY:-change-me}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  ingest:
    build: .
    command: ["kumasi-transit", "ingest"]
    environment:
      DATABASE_URL: postgresql+psycopg://transit:transit@db:5432/transit
      MQTT_HOST: mqtt
    depends_on:
      - api
      - mqtt

  simulator:
    build: .
    profiles: ["demo"]
    command: ["kumasi-transit", "simulate", "--interval", "20"]
    environment:
      MQTT_HOST: mqtt
    depends_on:
      - mqtt
      - ingest

volumes:
  dbdata:
  mqttdata:
