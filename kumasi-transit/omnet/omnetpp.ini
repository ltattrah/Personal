[General]
network = kumasi_cadence.TrackerNet
sim-time-limit = 4h
warmup-period = 10min
seed-set = ${repetition}
repeat = 3
result-dir = results
**.vector-recording = false
**.tracker[*].speedKph = 60
**.tracker[*].routeLengthKm = 250        # Kumasi-Accra
**.tracker[*].payloadBytes = 180
**.server.sampleInterval = 1s

# Sweep reporting interval x packet error rate. Reproduces the analytic model in
# kumasi_transit.cadence with network delay and loss added.
[Config CadenceSweep]
description = "reporting interval vs loss, 10 STC/VIP coaches"
TrackerNet.numTrackers = 10
TrackerNet.per = ${per=0.02, 0.05, 0.10}
**.tracker[*].reportInterval = ${T=5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 300}s

# Urban trotro variant for Phase 3 planning: slower, shorter routes, worse coverage.
[Config TrotroSweep]
description = "urban corridor cadence"
TrackerNet.numTrackers = 20
TrackerNet.per = ${per=0.05, 0.15}
**.tracker[*].speedKph = 16
**.tracker[*].routeLengthKm = 8
**.tracker[*].dwellTime = 120s
**.tracker[*].reportInterval = ${T=5, 10, 20, 30, 60}s

[Config Single]
description = "one run for the IDE / debugging"
TrackerNet.numTrackers = 3
**.tracker[*].reportInterval = 30s
repeat = 1
**.vector-recording = true
